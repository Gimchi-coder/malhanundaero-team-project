<!doctype html><html lang=ko><body><h1>메모</h1><input id=t><button onclick="add()">추가</button><ul id=l></ul><script>function add(){let li=document.createElement('li');li.textContent=t.value;l.appendChild(li);saveToLocalStorage();t.value=''}function saveToLocalStorage(){let items=[];for(let i=0;i<l.children.length;i++){items.push(l.children[i].textContent)}localStorage.setItem('memoItems',JSON.stringify(items))}function loadFromLocalStorage(){let items=JSON.parse(localStorage.getItem('memoItems'));if(items){items.forEach(item=>{let li=document.createElement('li');li.textContent=item;l.appendChild(li)})}}loadFromLocalStorage();</script></body></html>
